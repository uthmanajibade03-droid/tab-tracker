<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tab Tracker · Dashboard</title>
<style>
  :root {
    --bg: #ffffff; --surface: #fbfbfa; --line: #e8e9e8;
    --ink: #141715; --ink-2: #5b625e; --ink-3: #858b87;
    --accent: #209C64; --accent-ink: #12603D; --track: #eef0ef;
    --danger: #b3261e;
    --mono: "Cascadia Mono", "Consolas", ui-monospace, monospace;
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141614; --surface: #1b1e1c; --line: #2a2e2b;
      --ink: #eceeed; --ink-2: #9aa19d; --ink-3: #6f7773;
      --accent: #26AC74; --accent-ink: #7fe0b4; --track: #242825;
      --danger: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  body { font: 14px/1.5 var(--sans); margin: 0; background: var(--bg); color: var(--ink);
         -webkit-font-smoothing: antialiased; }

  header { padding: 26px 32px; border-bottom: 1px solid var(--line); background: var(--bg);
           display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 17px; font-weight: 400; letter-spacing: -0.01em; }
  /* The wordmark no longer needs colouring — it is the only h1 on the page. */
  header h1 .brand { color: inherit; }
  header .controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }

  select, button, a.btn { font: inherit; font-size: 12.5px; padding: 6px 11px;
    border: 1px solid var(--line); background: var(--bg); border-radius: 7px;
    cursor: pointer; color: var(--ink-2); text-decoration: none;
    transition: color 160ms, border-color 160ms; }
  select:hover, button:hover, a.btn:hover { color: var(--ink); border-color: var(--ink-3); background: var(--surface); }
  button.danger { color: var(--danger); border-color: var(--line); }
  button.danger:hover { border-color: var(--danger); background: transparent; }
  button.spin { opacity: 0.6; cursor: wait; }

  main { padding: 26px 32px; max-width: 960px; margin: 0 auto; }

  .summary { display: flex; gap: 16px; margin-bottom: 22px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
          padding: 14px 16px; flex: 1; min-width: 0; }
  .stat .label { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.22em;
                 text-transform: uppercase; color: var(--ink-3); }
  .stat .value { font-size: 26px; font-weight: 400; margin-top: 8px;
                 letter-spacing: -0.022em; font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; background: transparent;
          border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { padding: 9px 13px; text-align: left; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: none; }
  th { background: var(--surface); font-family: var(--mono); font-weight: 400; font-size: 9px;
       letter-spacing: 0.2em; color: var(--ink-3); text-transform: uppercase;
       cursor: pointer; user-select: none; }
  th:hover { color: var(--ink-2); }
  td { font-size: 13px; }
  th.num, td.num { text-align: right; }
  td.num { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2);
           font-variant-numeric: tabular-nums; }
  th .arrow { display: inline-block; width: 8px; color: var(--ink-2); }
  /* Thinner, like every other measure in the product. */
  .bar { display: inline-block; height: 3px; background: var(--accent); border-radius: 2px;
         vertical-align: middle; margin-left: 8px; opacity: 0.85; }

  .empty { text-align: center; padding: 48px; color: var(--ink-3); font-size: 13px; }
  .sync-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
              font-family: var(--mono); font-size: 10px; letter-spacing: 0.04em; color: var(--ink-3); }
  .sync-row .status-ok { color: var(--accent); }
  .sync-row .status-err { color: var(--danger); }
  .sync-row .status-busy { color: var(--ink-3); }
</style>
</head>
<body>
  <header>
    <h1><span class="brand">Tab</span> Tracker</h1>
    <div class="controls">
      <label>Day: <select id="day"></select></label>
      <label title="Alert fires after this many cumulative minutes in social / entertainment / games today">
        Alert threshold:
        <input id="threshold" type="number" min="1" max="1440" style="width: 60px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; font: inherit; font-variant-numeric: tabular-nums;" />
        <span style="color: var(--muted); font-size: 12px;">min</span>
        <span id="threshold-saved" style="color: var(--accent); font-size: 11px; font-weight: 600; display: none;">Saved</span>
      </label>
      <button id="sync">↻ Sync now</button>
      <button id="export">Export JSON</button>
      <button id="opts">Settings</button>
      <button id="clear" class="danger">Clear all</button>
    </div>
  </header>
  <main>
    <div class="sync-row" id="sync-row"></div>
    <div class="summary">
      <div class="stat"><div class="label">Sites</div><div class="value" id="s-sites">—</div></div>
      <div class="stat"><div class="label">Visits</div><div class="value" id="s-visits">—</div></div>
      <div class="stat"><div class="label">Active time</div><div class="value" id="s-active">—</div></div>
    </div>
    <table id="tbl">
      <thead>
        <tr>
          <th data-sort="domain">Site <span class="arrow"></span></th>
          <th class="num" data-sort="opens">Visits <span class="arrow"></span></th>
          <th class="num" data-sort="activeMs">Active time <span class="arrow">▼</span></th>
          <th class="num">Share</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="empty" hidden>No activity tracked for this day.</div>
  </main>
  <script src="dashboard.js"></script>
</body>
</html>
