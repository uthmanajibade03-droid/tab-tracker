<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tab Tracker</title>
<style>
  body { font: 13px system-ui, sans-serif; margin: 0; padding: 12px; width: 320px; color: #222; }
  h1 { font-size: 13px; margin: 0 0 8px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
  h1 small { font-weight: normal; color: #888; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 4px 6px; font-weight: normal; }
  th { color: #888; font-size: 11px; border-bottom: 1px solid #eee; }
  tr:nth-child(even) td { background: #fafafa; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .domain { max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .footer { margin-top: 8px; display: flex; justify-content: space-between; align-items: center; }
  .footer a { color: #06c; text-decoration: none; font-size: 12px; cursor: pointer; }
  .footer a:hover { text-decoration: underline; }
  .totals { color: #555; font-size: 12px; }
  .empty { color: #888; text-align: center; padding: 16px; font-style: italic; }
</style>
</head>
<body>
  <h1>Today <small id="date"></small></h1>
  <div class="totals" id="totals"></div>
  <table id="tbl">
    <thead><tr><th>Site</th><th class="num">Visits</th><th class="num">Active</th></tr></thead>
    <tbody></tbody>
  </table>
  <div class="empty" id="empty" hidden>No activity tracked yet.</div>
  <div class="footer">
    <a id="dash">Open dashboard →</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
