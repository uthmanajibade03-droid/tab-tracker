<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tab Tracker</title>
<style>

  /* Shared with desktop/renderer/stats.css so the two products read alike. */
  :root {
    --bg: #ffffff; --surface: #fbfbfa; --line: #e8e9e8;
    --ink: #141715; --ink-2: #5b625e; --ink-3: #858b87;
    --accent: #209C64; --accent-ink: #12603D; --track: #eef0ef;
    --danger: #b3261e;
    --mono: "Cascadia Mono", "Consolas", ui-monospace, monospace;
    --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141614; --surface: #1b1e1c; --line: #2a2e2b;
      --ink: #eceeed; --ink-2: #9aa19d; --ink-3: #6f7773;
      --accent: #26AC74; --accent-ink: #7fe0b4; --track: #242825;
      --danger: #f2b8b5;
    }
  }
  /* A label: mono, small, widely tracked. Used above every group of content,
     the same device the pill uses. */
  .lbl {
    font-family: var(--mono); font-size: 9.5px; font-weight: 400;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-3);
  }

  body { font: 13px/1.5 var(--sans); margin: 0; padding: 14px; width: 360px;
         color: var(--ink); background: var(--bg); }

  /* ---- tabs ---- */
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 0 0 12px; }
  .tab { background: none; border: none; padding: 7px 10px; font: inherit;
         font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.18em;
         text-transform: uppercase; color: var(--ink-3); cursor: pointer;
         border-bottom: 1px solid transparent; margin-bottom: -1px; }
  .tab:hover { color: var(--ink-2); }
  .tab.active { color: var(--ink); border-bottom-color: var(--ink); }
  .tabview { display: none; }
  .tabview.active { display: block; }

  /* ---- add row ---- */
  .add-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .add-row input { flex: 1; padding: 7px 9px; border: 1px solid var(--line);
                   border-radius: 7px; font: inherit; font-size: 12.5px;
                   background: var(--bg); color: var(--ink); }
  .add-row input::placeholder { color: var(--ink-3); }
  .add-row input:focus { outline: none; border-color: var(--ink-2); }
  /* One neutral toggle rather than two coloured states — the label is the
     information, the colour was decoration. */
  .kind-toggle { border: 1px solid var(--line); background: var(--surface);
                 color: var(--ink-2); padding: 5px 8px; border-radius: 7px;
                 cursor: pointer; font-family: var(--mono); font-size: 9px;
                 letter-spacing: 0.14em; text-transform: uppercase; min-width: 64px; }
  .kind-toggle:hover { color: var(--ink); border-color: var(--ink-3); }
  .add-btn { background: var(--accent); color: #fff; border: none; padding: 6px 12px;
             border-radius: 7px; cursor: pointer; font: inherit; font-size: 12px; }
  .add-btn:hover { filter: brightness(1.08); }
  .add-btn:disabled { opacity: 0.35; cursor: default; filter: none; }

  /* ---- lists ---- */
  .section-head { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.22em;
                  text-transform: uppercase; color: var(--ink-3); padding: 12px 2px 6px; }
  .item { display: flex; align-items: flex-start; gap: 8px; padding: 6px;
          border-radius: 7px; }
  .item:hover { background: var(--surface); }
  .item input[type="checkbox"] { margin-top: 2px; accent-color: var(--accent); }
  .item .txt { flex: 1; word-break: break-word; line-height: 1.4; font-size: 12.5px; }
  .item.done .txt { color: var(--ink-3); text-decoration: line-through; }
  /* Was a coloured badge; now a quiet initial that does not fight the text. */
  .item .pill { display: inline-block; font-family: var(--mono); font-size: 8.5px;
                letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3);
                margin-right: 6px; vertical-align: 1px; }
  .item .actions { display: flex; gap: 2px; opacity: 0; transition: opacity 0.15s; }
  .item:hover .actions { opacity: 1; }
  .item .actions button { background: none; border: none; padding: 0 4px; cursor: pointer;
                          color: var(--ink-3); font: inherit; font-size: 11px; }
  .item .actions button:hover { color: var(--ink); }
  .item .actions .del:hover { color: var(--danger); }
  .empty { color: var(--ink-3); text-align: center; padding: 20px; font-size: 11.5px; }
  .by { color: var(--ink-3); font-size: 10px; }

  /* ---- stats tab ---- */
  h1 { font-size: 13px; margin: 0 0 10px; font-weight: 400;
       display: flex; justify-content: space-between; align-items: baseline; }
  h1 small { font-family: var(--mono); font-size: 10px; letter-spacing: 0.04em;
             color: var(--ink-3); font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px; font-weight: normal; }
  th { font-family: var(--mono); font-size: 9px; letter-spacing: 0.2em;
       text-transform: uppercase; color: var(--ink-3);
       border-bottom: 1px solid var(--line); }
  /* Hairline rules instead of zebra fill: striping a five-row table is noise. */
  tbody tr { border-bottom: 1px solid var(--line); }
  tbody tr:last-child { border-bottom: none; }
  td { font-size: 12.5px; }
  td.num { text-align: right; font-family: var(--mono); font-size: 11px;
           color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .domain { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .totals { color: var(--ink-2); font-size: 12px; }
  .sync { font-family: var(--mono); font-size: 10px; color: var(--ink-3); margin-top: 10px;
          display: flex; justify-content: space-between; align-items: center; }
  .sync .status-ok { color: var(--accent); }
  .sync .status-err { color: var(--danger); }

  /* ---- settings + footer ---- */
  .settings { margin-top: 12px; padding: 10px 12px; background: var(--surface);
              border: 1px solid var(--line); border-radius: 9px; }
  .settings .row { display: flex; align-items: center; justify-content: space-between;
                   gap: 8px; margin: 6px 0; font-size: 11.5px; }
  .settings input[type="number"] { width: 62px; padding: 4px 7px; border: 1px solid var(--line);
                                   border-radius: 5px; font-family: var(--mono); font-size: 11px;
                                   background: var(--bg); color: var(--ink);
                                   font-variant-numeric: tabular-nums; }
  .settings .label { color: var(--ink-2); }
  .settings .saved { font-family: var(--mono); font-size: 9px; letter-spacing: 0.18em;
                     text-transform: uppercase; color: var(--accent); }
  .settings a, .settings button.link { color: var(--accent); text-decoration: none;
                                       font-size: 11.5px; cursor: pointer; background: none;
                                       border: none; padding: 0; font: inherit; }
  .settings a:hover, .settings button.link:hover { text-decoration: underline; }
  .settings .toggle { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; }
  .settings input[type="checkbox"] { accent-color: var(--accent); }

  .footer { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
            display: flex; justify-content: space-between; align-items: center;
            gap: 6px; flex-wrap: wrap; }
  .footer a, .footer button { color: var(--accent); text-decoration: none; font-size: 12px;
                              cursor: pointer; background: none; border: none; padding: 0; font: inherit; }
  .footer a:hover, .footer button:hover { text-decoration: underline; }
  .test-alert { border: 1px solid var(--line); color: var(--ink-2); background: var(--surface);
                padding: 5px 11px; border-radius: 7px; cursor: pointer; font: inherit; font-size: 11px; }
  .test-alert:hover { color: var(--ink); border-color: var(--ink-3); }
</style>
</head>
<body>
  <div class="tabs">
    <button type="button" class="tab active" data-tab="todos">To-dos</button>
    <button type="button" class="tab" data-tab="stats">Today's stats</button>
    <button type="button" class="tab" data-tab="settings">Settings</button>
  </div>

  <div class="tabview active" data-view="todos">
    <div class="add-row">
      <input id="todo-input" type="text" placeholder="Add a personal to-do…" maxlength="500" autofocus />
      <button id="todo-kind" class="kind-toggle personal" title="Click to switch between Personal and Shared">Personal</button>
      <button id="todo-add-btn" class="add-btn">+</button>
    </div>
    <div id="todo-list"></div>
  </div>

  <div class="tabview" data-view="stats">
    <h1>Today <small id="date"></small></h1>
    <div class="totals" id="totals"></div>
    <table id="tbl">
      <thead><tr><th>Site</th><th class="num">Visits</th><th class="num">Active</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="empty" hidden>No activity tracked yet.</div>
    <div class="sync" id="sync"></div>
  </div>

  <div class="tabview" data-view="settings">
    <div class="settings">
      <div class="row">
        <span class="label">Alert threshold (minutes)</span>
        <span>
          <input id="threshold" type="number" min="1" max="1440" />
          <span id="threshold-saved" class="saved" hidden>Saved</span>
        </span>
      </div>
      <div class="row">
        <label class="toggle">
          <input id="show-widget" type="checkbox" />
          <span class="label">Show floating to-do widget on every page</span>
        </label>
      </div>
      <div class="row">
        <span class="label">Keyboard shortcuts</span>
        <button class="link" id="open-shortcuts">Customize ↗</button>
      </div>
      <div class="row">
        <span class="label">Test the alert animation</span>
        <button id="test-alert" class="test-alert">Fire test alert</button>
      </div>
    </div>
  </div>

  <div class="footer">
    <a id="dash">Open dashboard →</a>
    <button id="opts">Advanced settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
