<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Tab Tracker</title>
<style>
  body { font: 13px system-ui, sans-serif; margin: 0; padding: 12px; width: 360px; color: #222; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid #eee; margin: 0 0 10px; }
  .tab { background: none; border: none; padding: 6px 10px; font: inherit; font-size: 12px; font-weight: 600; color: #888; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab.active { color: #209C64; border-bottom-color: #209C64; }
  .tabview { display: none; }
  .tabview.active { display: block; }

  .add-row { display: flex; gap: 4px; margin-bottom: 8px; }
  .add-row input { flex: 1; padding: 6px 8px; border: 1px solid #ddd; border-radius: 6px; font: inherit; font-size: 12px; }
  .add-row input:focus { outline: none; border-color: #209C64; }
  .kind-toggle { border: 1px solid #ddd; background: #fff; padding: 5px 7px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; min-width: 60px; }
  .kind-toggle.personal { background: #f0f7f3; color: #12603D; border-color: #b8e6cf; }
  .kind-toggle.shared { background: #fff3e0; color: #b35900; border-color: #ffd699; }
  .add-btn { background: #209C64; color: #fff; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 12px; font-weight: 600; }
  .add-btn:hover { background: #12603D; }
  .add-btn:disabled { opacity: 0.4; cursor: default; }

  .section-head { font-size: 10px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.05em; padding: 8px 4px 4px; }
  .item { display: flex; align-items: flex-start; gap: 6px; padding: 5px 6px; border-radius: 6px; }
  .item:hover { background: #f5f5f5; }
  .item input[type="checkbox"] { margin-top: 2px; }
  .item .txt { flex: 1; word-break: break-word; line-height: 1.35; font-size: 12px; }
  .item.done .txt { color: #aaa; text-decoration: line-through; }
  .item .pill { display: inline-block; font-size: 8px; font-weight: 800; padding: 1px 4px; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 4px; vertical-align: 1px; }
  .item .pill.p { background: #e3f2eb; color: #12603D; }
  .item .pill.s { background: #fff3e0; color: #b35900; }
  .item .actions { display: flex; gap: 2px; opacity: 0; transition: opacity 0.15s; }
  .item:hover .actions { opacity: 1; }
  .item .actions button { background: none; border: none; padding: 0 4px; cursor: pointer; color: #888; font: inherit; font-size: 11px; }
  .item .actions button:hover { color: #222; }
  .item .actions .del:hover { color: #c00; }
  .empty { font-style: italic; color: #aaa; text-align: center; padding: 16px; font-size: 11px; }

  /* Stats tab */
  h1 { font-size: 13px; margin: 0 0 8px; font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
  h1 small { font-weight: normal; color: #888; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 4px 6px; font-weight: normal; }
  th { color: #888; font-size: 11px; border-bottom: 1px solid #eee; }
  tr:nth-child(even) td { background: #fafafa; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .domain { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .totals { color: #555; font-size: 12px; }
  .sync { font-size: 11px; color: #888; margin-top: 6px; display: flex; justify-content: space-between; align-items: center; }
  .sync .status-ok { color: #209C64; }
  .sync .status-err { color: #b00; }

  /* Settings strip + footer */
  .settings { margin-top: 10px; padding: 8px 10px; background: #fafafa; border: 1px solid #eee; border-radius: 6px; }
  .settings .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0; font-size: 11px; }
  .settings input[type="number"] { width: 60px; padding: 3px 6px; border: 1px solid #ddd; border-radius: 4px; font: inherit; font-size: 11px; font-variant-numeric: tabular-nums; }
  .settings .label { color: #555; }
  .settings .saved { color: #209C64; font-weight: 600; font-size: 10px; }
  .settings a, .settings button.link { color: #209C64; text-decoration: none; font-size: 11px; cursor: pointer; background: none; border: none; padding: 0; font: inherit; }
  .settings a:hover, .settings button.link:hover { text-decoration: underline; }
  .settings .toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }

  .footer { margin-top: 10px; padding-top: 8px; border-top: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; gap: 4px; flex-wrap: wrap; }
  .footer a, .footer button { color: #209C64; text-decoration: none; font-size: 12px; cursor: pointer; background: none; border: none; padding: 0; font: inherit; }
  .footer a:hover, .footer button:hover { text-decoration: underline; }
  .test-alert { background: #fef0f0; border: 1px solid #ffd5d5; color: #b00; padding: 4px 10px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 11px; }
  .test-alert:hover { background: #ffe2e2; }
</style>
</head>
<body>
  <div class="tabs">
    <button type="button" class="tab active" data-tab="todos">To-dos</button>
    <button type="button" class="tab" data-tab="stats">Today's stats</button>
    <button type="button" class="tab" data-tab="settings">Settings</button>
  </div>

  <div class="tabview active" data-view="todos">
    <div class="add-row">
      <input id="todo-input" type="text" placeholder="Add a personal to-do…" maxlength="500" autofocus />
      <button id="todo-kind" class="kind-toggle personal" title="Click to switch between Personal and Shared">Personal</button>
      <button id="todo-add-btn" class="add-btn">+</button>
    </div>
    <div id="todo-list"></div>
  </div>

  <div class="tabview" data-view="stats">
    <h1>Today <small id="date"></small></h1>
    <div class="totals" id="totals"></div>
    <table id="tbl">
      <thead><tr><th>Site</th><th class="num">Visits</th><th class="num">Active</th></tr></thead>
      <tbody></tbody>
    </table>
    <div class="empty" id="empty" hidden>No activity tracked yet.</div>
    <div class="sync" id="sync"></div>
  </div>

  <div class="tabview" data-view="settings">
    <div class="settings">
      <div class="row">
        <span class="label">Alert threshold (minutes)</span>
        <span>
          <input id="threshold" type="number" min="1" max="1440" />
          <span id="threshold-saved" class="saved" hidden>Saved</span>
        </span>
      </div>
      <div class="row">
        <label class="toggle">
          <input id="show-widget" type="checkbox" />
          <span class="label">Show floating to-do widget on every page</span>
        </label>
      </div>
      <div class="row">
        <span class="label">Keyboard shortcuts</span>
        <button class="link" id="open-shortcuts">Customize ↗</button>
      </div>
      <div class="row">
        <span class="label">Test the alert animation</span>
        <button id="test-alert" class="test-alert">Fire test alert</button>
      </div>
    </div>
  </div>

  <div class="footer">
    <a id="dash">Open dashboard →</a>
    <button id="opts">Advanced settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
