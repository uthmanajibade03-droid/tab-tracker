<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!--
    Defence in depth. The pill only ever renders local files and never loads
    remote content, so this policy blocks everything by default and permits
    only same-directory scripts/styles. `file:` is listed alongside 'self'
    because Chromium treats file:// documents as opaque origins, where 'self'
    alone does not reliably match sibling files.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; img-src 'self' file: data:; media-src 'self' file: https:;" />
  <title>Tab Tracker</title>
  <link rel="stylesheet" href="pill.css" />
</head>
<body>
  <!--
    The window is transparent; the capsule and the panel are the only painted
    surfaces. They are siblings in a flex column so that the panel can be put
    above the pill (via `order`) when the pill sits near the bottom of a
    display and the window has to grow upward.
  -->
  <div class="shell" id="shell">

    <div class="pill" id="pill"
         role="button" tabindex="0"
         aria-haspopup="dialog" aria-expanded="false" aria-controls="panel"
         aria-label="Tab Tracker — open settings">
      <!--
        Two rows. The label says what the number is and what the tracker is
        doing; the line under it says what you are actually in. Cross-faded as
        a unit whenever the focused app changes.
      -->
      <div class="content" id="content">
        <div class="meta">
          <span class="tag" id="tag">Waiting</span>
          <span class="time" id="time">0m 00s</span>
        </div>
        <div class="headline">
          <span class="app" id="app">Waiting…</span>
          <span class="domain" id="domain" hidden></span>
        </div>
      </div>

      <div class="panel" id="panel" role="dialog" aria-label="Today so far" hidden>

        <!--
          The card: a label with the figure, the headline, a rule, then the rows.
          Settings are not here — they are in the pill's right-click menu and in
          the tray, both of which already carry every one of them.
        -->
        <div class="card-head">
          <span class="card-label">Today so far</span>
          <span class="card-value" id="p-total">—</span>
        </div>
        <p class="card-lede">
          <span class="lede-main" id="p-count">—</span>
          <span class="lede-sub" id="p-note"></span>
        </p>
        <div class="card-rule"></div>
        <div id="p-apps"></div>
        <p class="card-empty" id="p-empty" hidden>Nothing tracked yet today.</p>


        <!-- Who's online, so a call doesn't require opening the whole app. -->
        <div class="peers" id="peers" hidden>
          <div class="peers-head">
            <span>Teammates</span>
            <span id="peers-status"></span>
          </div>
          <div id="peers-list"></div>
        </div>

        <!-- Right-click the pill for tracking, reset, folder and quit. -->
      </div>

      <!-- Prayer alert. Shares the panel's slot below the pill, but is driven by
           a timer rather than by the user, so it lives outside #panel. -->
      <div class="alert" id="alert" role="status" aria-live="polite" hidden>
        <!-- Only shown on the verse card; the prayer-name card stays plain. -->
        <video class="alert-scene" id="alert-scene"></video>
        <!-- Prayer card: label row, sentence, then the day's five. -->
        <div class="alert-head" id="alert-head">
          <span class="alert-tag" id="alert-name"></span>
          <span class="alert-clock" id="alert-time"></span>
        </div>
        <p class="alert-lede" id="alert-lede">
          <span class="lede-main" id="alert-lede-main"></span>
          <span class="lede-sub" id="alert-lede-sub"></span>
        </p>
        <div class="alert-rule" id="alert-rule" hidden></div>
        <div class="alert-times" id="alert-times" hidden></div>
        <p class="alert-arabic" id="alert-arabic" hidden></p>
        <p class="alert-english" id="alert-english" hidden></p>
        <div class="alert-ref" id="alert-ref" hidden></div>
        <div class="alert-actions" id="alert-actions">
          <button class="alert-dismiss" type="button" id="alert-dismiss">Dismiss</button>
          <button class="alert-answer" type="button" id="call-answer" hidden>Answer</button>
          <button class="alert-decline" type="button" id="call-decline" hidden>Decline</button>
        </div>
      </div>
      <!-- Grab the right edge to resize. Exposed as a slider so it is also
           reachable from the keyboard (arrows nudge, Home/End jump). -->
      <div class="grip" id="grip"
           role="slider" tabindex="0"
           aria-label="Pill size" aria-orientation="horizontal"
           title="Drag to resize"></div>
    </div>

  </div>

  <audio id="alert-audio" preload="none"></audio>

  <script src="scene.js"></script>
  <script src="pill.js"></script>
</body>
</html>
